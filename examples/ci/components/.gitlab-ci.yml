# Pipeline of the components project itself: check the templates,
# then publish a release when a version tag is pushed.

stages:
  - test
  - release

yamllint:
  stage: test
  image: python:3.13-slim
  tags:
    - docker
  script:
    - pip install --quiet yamllint
    - yamllint templates/

create-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  tags:
    - docker
  script:
    - echo "Releasing $CI_COMMIT_TAG"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+$/
  release:
    tag_name: $CI_COMMIT_TAG
    description: "Release $CI_COMMIT_TAG of the Acme CI/CD components"
