spec:
  inputs:
    stage:
      default: build
    image_name:
      description: Full image name without tag. Defaults to the project's registry path.
      default: $CI_REGISTRY_IMAGE
    dockerfile:
      default: Dockerfile
    context:
      default: .
    docker_version:
      default: "29"
    push:
      type: boolean
      description: Push the image to the registry after the build
      default: true
    runner_tag:
      default: docker
---
docker-build:
  stage: $[[ inputs.stage ]]
  image: docker:$[[ inputs.docker_version ]]
  services:
    - docker:$[[ inputs.docker_version ]]-dind
  tags:
    - $[[ inputs.runner_tag ]]
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_HOST: tcp://docker:2376  # explicit: do not rely on the image entrypoint running
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"
    # Docker 29 adds provenance attestation manifests to every image it builds. The GitLab 19.5 Container Registry
    # (metadata database mode) rejects that push with "blob unknown to registry", so switch the attestations off.
    BUILDX_NO_DEFAULT_ATTESTATIONS: "1"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - |
      docker build --pull \
        --build-arg APP_VERSION="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}" \
        --build-arg VCS_REF="$CI_COMMIT_SHA" \
        -f $[[ inputs.dockerfile ]] \
        -t "$[[ inputs.image_name ]]:$CI_COMMIT_SHORT_SHA" \
        $[[ inputs.context ]]
    - |
      if [ "$[[ inputs.push ]]" = "true" ]; then
        docker push "$[[ inputs.image_name ]]:$CI_COMMIT_SHORT_SHA"
      fi
