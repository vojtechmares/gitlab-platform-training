# Chapter 7, part 3 - the complete pipeline: test, build the image, deploy to dev and production.
# Copy to .gitlab-ci.yml in your hello-app project.
#
# test   : lint and unit tests (every pipeline)
# build  : build the Docker image and push it to the project's Container Registry
# deploy : roll the image out to the Docker host over SSH (dev automatically, production by hand)
#
# Required CI/CD variables. In the training they exist at instance level (Admin > Settings >
# CI/CD > Variables), created by scripts/seed-training-data.sh; Chapter 7 explains the levels:
#   DEPLOY_HOST        address of the Docker host
#   DEPLOY_SSH_PORT    SSH port of the Docker host (6022 in the training setup)
#   DEPLOY_USER        SSH user on the Docker host (deploy)
#   SSH_PRIVATE_KEY    private key for DEPLOY_USER           (type: File, protected)
#   SSH_KNOWN_HOSTS    host key line(s) of the Docker host   (type: Variable)
#                      produced by:  ssh-keyscan -p <port> <host>   (entries look like "[host]:6022 ssh-ed25519 ...")

stages:
  - test
  - build
  - deploy

# One pipeline per change: a merge request pipeline when an MR is open,
# a branch pipeline otherwise, and a pipeline for every tag.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

default:
  image: python:3.13-slim
  tags:
    - docker

variables:
  IMAGE: $CI_REGISTRY_IMAGE
  PIP_CACHE_DIR: $CI_PROJECT_DIR/.cache/pip
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

.python-cache:
  cache:
    key:
      files:
        - requirements-dev.txt
    paths:
      - .cache/pip

lint:
  extends: .python-cache
  stage: test
  script:
    - pip install --quiet ruff
    - ruff check .

unit-tests:
  extends: .python-cache
  stage: test
  script:
    - pip install --quiet -r requirements-dev.txt
    - pytest --junitxml=report.xml
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: report.xml

build-image:
  stage: build
  image: docker:29
  services:
    - docker:29-dind
  variables:
    # TLS between the job container and the dind service (certs shared via the runner volume).
    DOCKER_TLS_CERTDIR: "/certs"
    # Point the client at the service explicitly. The docker image's entrypoint would do this too,
    # but whether the entrypoint runs depends on the executor, so do not rely on it.
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"
    # Docker 29 adds provenance attestation manifests to every image it builds. The GitLab 19.5 Container Registry
    # (metadata database mode) rejects that push with "blob unknown to registry", so switch the attestations off.
    BUILDX_NO_DEFAULT_ATTESTATIONS: "1"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - |
      docker build --pull \
        --build-arg APP_VERSION="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}" \
        --build-arg VCS_REF="$CI_COMMIT_SHA" \
        -t "$IMAGE:$CI_COMMIT_SHORT_SHA" .
    - docker push "$IMAGE:$CI_COMMIT_SHORT_SHA"
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker tag "$IMAGE:$CI_COMMIT_SHORT_SHA" "$IMAGE:$CI_COMMIT_TAG"
        docker push "$IMAGE:$CI_COMMIT_TAG"
      fi

# Hidden job: shared by every deploy job. Not run by itself.
.deploy:
  stage: deploy
  image: docker:29-cli
  before_script:
    - apk add --no-cache openssh-client
    - install -d -m 700 ~/.ssh
    - cp "$SSH_PRIVATE_KEY" ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
    # The Docker CLI talks to the remote daemon over SSH. Registry credentials stay in this
    # job: the CLI sends them along when the remote daemon pulls the image, and they expire
    # with the job. Nothing is stored on the Docker host.
    - export DOCKER_HOST="ssh://${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_SSH_PORT}"
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - export IMAGE="$IMAGE:$CI_COMMIT_SHORT_SHA"
    - export APP_VERSION="$CI_COMMIT_SHORT_SHA"
    - docker compose -f deploy/compose.yaml up -d --remove-orphans --wait
    - docker compose -f deploy/compose.yaml ps

deploy-dev:
  extends: .deploy
  variables:
    APP_ENVIRONMENT: dev
    APP_PORT: "8081"
    COMPOSE_PROJECT_NAME: hello-app-dev
  environment:
    name: dev
    url: http://$DEPLOY_HOST:8081
  resource_group: dev
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

deploy-prod:
  extends: .deploy
  variables:
    APP_ENVIRONMENT: production
    APP_PORT: "8080"
    COMPOSE_PROJECT_NAME: hello-app-prod
  environment:
    name: production
    url: http://$DEPLOY_HOST:8080
  resource_group: production
  needs:
    - deploy-dev
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
