# Deployed to the Docker host by the pipeline (see .gitlab-ci.yml, job "deploy").
# All values come from the environment so the same file serves every environment.
name: ${COMPOSE_PROJECT_NAME:-hello-app}

services:
  app:
    image: ${IMAGE}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8000"
    environment:
      APP_VERSION: ${APP_VERSION:-unknown}
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-unknown}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
